# cargo-audit configuration. Every ignored advisory here also appears in
# deny.toml and the advisory baseline (dependency-policy/), with the same
# reason, so both scanners apply the same reviewed exceptions.
[advisories]
ignore = [
  # h2 0.3 comes in through Actix 4. The local servers do not expose an
  # HTTP/2 service to the network.
  "RUSTSEC-2026-0258",
  # hickory-proto 0.25 comes in through grammers. DNSSEC validation is not
  # enabled, and moving to 0.26 needs a grammers update.
  "RUSTSEC-2026-0118",
  "RUSTSEC-2026-0119",
]
