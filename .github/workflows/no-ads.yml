name: No advertising or payment references

# Runs on every pull request and push without a path filter: an ad or payment
# host could return through any file, including documentation.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to any non-main ref supersedes the running checks.
# Runs on main are never cancelled, so every main commit keeps a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  no-ads:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject advertising, payment, donation, DoH-fallback and spoofed-UA references
        run: node scripts/check-no-ads.cjs
