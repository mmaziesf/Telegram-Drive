name: Arch package

on:
  pull_request:
    paths:
      - '.github/workflows/arch-package.yml'
      - '.github/workflows/release.yml'
      - 'packaging/arch/**'
      - 'scripts/render-arch-pkgbuild.sh'
      - 'scripts/verify-arch-package.sh'
      - 'scripts/generate-arch-runtime-sbom.sh'
      - 'app/src-tauri/src/installation.rs'
      - 'app/src-tauri/src/linux_startup.rs'
      - 'app/src/hooks/useUpdateCheck.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/arch-package.yml'
      - '.github/workflows/release.yml'
      - 'packaging/arch/**'
      - 'scripts/render-arch-pkgbuild.sh'
      - 'scripts/verify-arch-package.sh'
      - 'scripts/generate-arch-runtime-sbom.sh'
      - 'app/src-tauri/src/installation.rs'
      - 'app/src-tauri/src/linux_startup.rs'
      - 'app/src/hooks/useUpdateCheck.ts'
  workflow_dispatch:

# A newer push to the same pull request supersedes the running checks.
# Runs on main are never cancelled, so every main commit keeps a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The package contract is checked against a Debian package built from this
  # commit, never against a binary downloaded from another project's releases.
  build-deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - id: version
        name: Read the application version
        run: echo "version=$(jq -r .version app/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Build the Debian package
        working-directory: app
        run: |
          npm ci
          npm run tauri -- build --ci --no-sign --bundles deb
      # Tauri names the package after the product name, with spaces; releases
      # publish it with dots, which is the name the PKGBUILD renderer expects.
      - name: Stage the package under its release file name
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p fixture
          cp "app/src-tauri/target/release/bundle/deb/Unofficial Telegram Drive_${PKG_VERSION}_amd64.deb" "fixture/Unofficial.Telegram.Drive_${PKG_VERSION}_amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-fixture-deb
          path: fixture/Unofficial.Telegram.Drive_${{ steps.version.outputs.version }}_amd64.deb
          if-no-files-found: error
          retention-days: 1

  package-contract:
    needs: build-deb
    env:
      PKG_VERSION: ${{ needs.build-deb.outputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: archlinux:base-devel-20260823.0.578598@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install package validation tools
        run: |
          pacman -Syu --noconfirm \
            cairo \
            curl \
            dbus \
            desktop-file-utils \
            gdk-pixbuf2 \
            gtk3 \
            jq \
            libayatana-appindicator \
            libarchive \
            libsoup3 \
            namcap \
            pacman-contrib \
            webkit2gtk-4.1 \
            xorg-server-xvfb \
            xorg-xauth

      - name: Download the Debian package built from this commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arch-fixture-deb
          path: fixture

      - name: Build and inspect the fixture package as an unprivileged user
        run: |
          set -euo pipefail
          bash scripts/render-arch-pkgbuild.sh "fixture/Unofficial.Telegram.Drive_${PKG_VERSION}_amd64.deb" "${PKG_VERSION}" arch-package
          useradd --create-home --shell /bin/bash arch-builder
          chown -R arch-builder:arch-builder arch-package
          runuser -u arch-builder -- bash -c 'cd "$1" && makepkg --printsrcinfo > .SRCINFO && makepkg --cleanbuild --clean --noconfirm' _ "$PWD/arch-package"
          package_path="$(find arch-package -maxdepth 1 -type f -name 'telegram-drive-bin-*.pkg.tar.zst' -print -quit)"
          test -n "${package_path}"
          namcap arch-package/PKGBUILD "${package_path}" 2>&1 | tee arch-package/namcap.log
          if grep -Eq '(^|[[:space:]])E:' arch-package/namcap.log; then
            echo '::error::namcap reported a package error'
            exit 1
          fi
          pacman -U --noconfirm "${package_path}"
          bash scripts/verify-arch-package.sh "${package_path}" "${PKG_VERSION}"

      - name: Verify the native package starts and produces a runtime SBOM
        run: |
          set -euo pipefail
          set +e
          runuser -u arch-builder -- dbus-run-session -- xvfb-run -a timeout --kill-after=5s 15s telegram-drive > arch-package/startup-smoke.log 2>&1
          smoke_status=$?
          set -e
          if [[ ${smoke_status} -ne 124 && ${smoke_status} -ne 137 ]]; then
            cat arch-package/startup-smoke.log
            exit 1
          fi
          if grep -Eiq 'EGL_BAD_ALLOC|Could not create.*EGL display|segmentation fault|thread .* panicked' arch-package/startup-smoke.log; then
            cat arch-package/startup-smoke.log
            exit 1
          fi
          bash scripts/generate-arch-runtime-sbom.sh "${PKG_VERSION}" arch-package/telegram-drive-arch-runtime-sbom.cdx.json
