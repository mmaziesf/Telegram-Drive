name: i18n Validation

on:
  push:
    branches: [main]
    paths:
      - 'app/src/i18n/**'
      - 'app/scripts/*i18n*'
      - '.github/workflows/i18n.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/i18n/**'
      - 'app/scripts/*i18n*'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

# A newer push to any non-main ref supersedes the running checks.
# Runs on main are never cancelled, so every main commit keeps a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  i18n-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: cd app && npm ci

      - name: Validate locale resources
        run: cd app && npm run i18n:validate

      - name: Scan UI literals
        run: cd app && npm run i18n:scan

      - name: Build test
        run: cd app && npm run build
