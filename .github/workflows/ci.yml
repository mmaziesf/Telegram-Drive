name: CI

# Runs on pull requests and pushes to main, skipping docs/markdown/locale-only
# changes to save Actions minutes.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'app/src/i18n/locales/**'
      - 'LICENSE*'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'app/src/i18n/locales/**'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to any non-main ref supersedes the running checks.
# Runs on main are never cancelled, so every main commit keeps a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0

jobs:
  frontend:
    name: Frontend lint, typecheck and end-to-end tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Typecheck
        working-directory: app
        run: npm run typecheck
      - name: Validate localization resources
        working-directory: app
        run: npm run i18n:check
      - name: Build and enforce bundle budgets
        working-directory: app
        run: npm run build:verify
      - name: Install Chromium for end-to-end tests
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: app
        run: npm run test:e2e

  rust:
    name: Rust fmt, clippy and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg
      - name: Validate project policy
        run: |
          node scripts/check-rust-formatting.cjs
          node scripts/check-test-policy.cjs
          node scripts/check-app-security.cjs
          node scripts/check-android-publication.cjs --tracked-only
      # The Tauri build embeds the frontend bundle, so build it first.
      - name: Build frontend bundle
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Check formatting
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        working-directory: app/src-tauri
        run: cargo clippy --locked --features native-e2e --lib --all-targets -- -D warnings
      # Runs every integration test under app/src-tauri/tests. Unit tests are
      # not used in this project (see scripts/check-test-policy.cjs).
      - name: Integration tests
        working-directory: app/src-tauri
        run: cargo test --locked --features native-e2e --test '*'

  supply-chain:
    name: Rust advisories, licenses and bans
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install pinned cargo-deny and cargo-audit
        run: |
          cargo install cargo-deny --locked --version 0.18.7
          cargo install cargo-audit --locked --version 0.22.2
      - name: Validate the expiring advisory baseline
        run: node scripts/check-rust-advisory-baseline.cjs
      - name: cargo-deny (advisories, licenses, bans, sources)
        run: cargo deny --manifest-path app/src-tauri/Cargo.toml check --config ../../deny.toml --hide-inclusion-graph advisories licenses bans sources
      # Reviewed exceptions are in .cargo/audit.toml. Each one matches an entry
      # in deny.toml and has its reason written next to it.
      - name: cargo-audit
        run: cargo audit --file app/src-tauri/Cargo.lock

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Install the release binary with a checked SHA-256 rather than a
      # third-party action, so the scan needs no token or license key.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      # Scans the full history. Reviewed false positives are listed by
      # fingerprint, with reasons, in .gitleaksignore.
      - name: Scan repository history
        run: ./gitleaks git --no-banner --redact --exit-code 1 .
