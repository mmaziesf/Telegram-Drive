name: Desktop sync CI

# Cost policy: pull requests and main pushes build Linux only. Add the
# 'ci:windows' label to a PR to include Windows. The full Windows + 2x macOS
# matrix runs only on workflow_dispatch and on release tags (v*).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "app/**"
      - "scripts/check-test-policy.cjs"
      - "scripts/check-app-security.cjs"
      - "scripts/check-android-publication.cjs"
      - "scripts/*smoke*"
      - "scripts/e2e/packaged-startup.e2e.cjs"
      - "scripts/e2e/fixtures/startup-smoke-app.cjs"
      - "scripts/e2e/fixtures/startup-profile-lock.ps1"
      - "dependency-policy/android-publication-review.json"
      - ".github/workflows/desktop-sync-ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so v* tags always run.
    tags: ['v*']
    paths:
      - "app/**"
      - "scripts/check-test-policy.cjs"
      - "scripts/check-app-security.cjs"
      - "scripts/check-android-publication.cjs"
      - "scripts/*smoke*"
      - "scripts/e2e/packaged-startup.e2e.cjs"
      - "scripts/e2e/fixtures/startup-smoke-app.cjs"
      - "scripts/e2e/fixtures/startup-profile-lock.ps1"
      - "dependency-policy/android-publication-review.json"
      - ".github/workflows/desktop-sync-ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# A newer push to any non-main ref supersedes the running checks.
# Runs on main are never cancelled, so every main commit keeps a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  RUST_TEST_THREADS: "4"

jobs:
  native-desktop:
    name: ${{ matrix.name }}
    # A 'labeled' event only matters when the label is ci:windows.
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:windows'
    strategy:
      fail-fast: false
      matrix:
        # Full matrix: workflow_dispatch or v* tag. PR with 'ci:windows' label:
        # Windows + Linux. Everything else: Linux only.
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '[{"name":"Windows","os":"windows-latest"},{"name":"Linux","os":"ubuntu-22.04"},{"name":"macOS","os":"macos-latest","target":"aarch64-apple-darwin"},{"name":"macOS Intel","os":"macos-latest","target":"x86_64-apple-darwin"}]' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:windows')) && '[{"name":"Windows","os":"windows-latest"},{"name":"Linux","os":"ubuntu-22.04"}]' || '[{"name":"Linux","os":"ubuntu-22.04"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libarchive-tools rpm patchelf libfuse2 xvfb xauth dbus-x11 ffmpeg

      - name: Ensure macOS video upload decoder for E2E journeys
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Validate E2E-only testing policy and app security configuration
        run: |
          node scripts/check-rust-formatting.cjs
          node scripts/check-test-policy.cjs
          node scripts/check-app-security.cjs
          node scripts/check-android-publication.cjs --tracked-only

      - name: Validate localization resources
        if: runner.os == 'Linux'
        working-directory: app
        run: npm run i18n:check

      - name: Build frontend
        working-directory: app
        run: npm run build:verify

      - name: Run crypto known-answer and input guard tests
        working-directory: app/src-tauri
        run: cargo test --locked --test crypto_envelope --test crypto_kat --test input_guards

      - name: Run native process and HTTP end-to-end journeys
        working-directory: app/src-tauri
        run: cargo test --locked --features native-e2e --test native_e2e

      - name: Verify Rust formatting
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Lint native targets without warnings
        working-directory: app/src-tauri
        run: cargo clippy --locked --features native-e2e --lib --all-targets -- -D warnings

      - name: Exercise smoke harness process ownership and failure journeys
        run: node scripts/e2e/packaged-startup.e2e.cjs

      - name: Build disposable CI installers
        working-directory: app
        run: npm run tauri -- build --ci --no-sign ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Verify Windows installer runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./app/scripts/verify-windows-bundle.ps1

      - name: Smoke each packaged Windows installer application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows-package.ps1

      - name: Smoke each packaged macOS or Linux application
        if: runner.os != 'Windows'
        run: bash scripts/smoke-packaged-artifacts.sh "app/src-tauri/target/${{ matrix.target }}/release/bundle"

  desktop-ui-e2e:
    name: Desktop UI end-to-end
    if: github.event.action != 'labeled'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run desktop UI end-to-end and visual regression tests
        working-directory: app
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-ui-e2e-report
          path: app/test-results
          if-no-files-found: ignore
